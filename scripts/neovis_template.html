<!DOCTYPE html>
<html>
<head>
  <script src="https://unpkg.com/neovis.js/dist/neovis.js"></script>
  <style>
    body { margin: 0; }
    #viz { width: 100%; height: 100vh; }
  </style>
</head>
<body>
  <div id="viz"></div>
  <script>
    function draw(query) {
      const config = {
        container_id: "viz",
        server_url: "{{NEO4J_URI}}",
        server_user: "{{NEO4J_USER}}",
        server_password: "{{NEO4J_PASSWORD}}",
        labels: {
          "Movie": { "caption": "title", "size": "20" },
          "Person": { "caption": "name", "size": "20" },
          "Genre":  { "caption": "name", "size": "20" }
        },
        relationships: {
          "HAS_GENRE": { "thickness": "2" },
          "WORKED_AS": { "thickness": "2" }
        },
        initial_cypher: query
      };
      const viz = new NeoVis.default(config);
      viz.render();
    }
  </script>
</body>
</html>
